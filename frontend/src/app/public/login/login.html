<div class="bg-gray-100 flex items-center justify-center min-h-screen">
  <div class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-md">
    <!-- Header -->
    <div class="text-center mb-8">
      <h2 class="text-3xl font-bold text-gray-800">Template Application</h2>
      <p class="text-sm text-gray-500 mt-2">Please enter your details to sign in</p>
    </div>

    <!-- Login Form -->
    <form #userForm="ngForm" (ngSubmit)="submitLogin()" novalidate class="space-y-5">
      <!-- Email Input -->
      <div>
        <tui-textfield>
          <label tuiLabel>Email Address</label>
          <input
            tuiInput
            type="text"
            name="email"
            [(ngModel)]="loginObject.username"
            class="w-full"
            required
          />
        </tui-textfield>
      </div>

      <!-- Password Input -->
      <div>
        <tui-textfield>
          <label tuiLabel>Password</label>
          <input
            tuiInput
            type="password"
            name="password1"
            class="w-full"
            [(ngModel)]="loginObject.password"
            required
          />
          <tui-icon tuiPassword />
        </tui-textfield>
      </div>

      <!-- Submit Button -->
      <div>
        <button class="daisy-btn btn-primary w-full" [disabled]="!userForm.form.valid">
          Sign in
        </button>
      </div>
    </form>
  </div>
</div>

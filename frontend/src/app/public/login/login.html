<div class="bg-gray-100 flex items-center justify-center min-h-screen">
  <div class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-md">
    <!-- Header -->
    <div class="text-center mb-8">
      <h2 class="text-3xl font-bold text-gray-800">Template Application</h2>
      <p class="text-sm text-gray-500 mt-2">Please enter your details to sign in</p>
    </div>

    <!-- Login Form -->
    <form #userForm="ngForm" (ngSubmit)="submitLogin()" novalidate class="space-y-5">
      <!-- Email Input -->
      <div>
        <label for="email" class="block text-sm font-medium text-gray-700 mb-1"
          >Email Address</label
        >
        <input
          pInputText
          type="text"
          name="email"
          id="email"
          [(ngModel)]="loginObject.username"
          class="w-full"
          placeholder="Email"
          required
        />
      </div>

      <!-- Password Input -->
      <div>
        <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <p-password
          [(ngModel)]="loginObject.password"
          [toggleMask]="true"
          autocomplete="on"
          [feedback]="false"
          class="w-full"
          name="password"
          [inputStyle]="{ width: '100%' }"
          required
        />
      </div>

      <!-- Submit Button -->
      <div>
        <p-button
          pRipple
          type="submit"
          styleClass="w-full"
          [raised]="true"
          label="Sign in"
          [disabled]="!userForm.form.valid"
        ></p-button>
      </div>
    </form>
  </div>
</div>

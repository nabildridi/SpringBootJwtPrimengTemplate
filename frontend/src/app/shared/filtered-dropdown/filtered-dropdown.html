<div class="relative active-zone" (tuiActiveZoneChange)="onZone($event)">
  <span class="w-full rounded-md shadow-sm">
    <tui-textfield
      [tuiTextfieldCleaner]="false"
      [invalid]="invalid()"
      [tuiDropdown]="dropdownContent"
      [attr.aria-expanded]="opened()"
      [tuiDropdownManual]="opened()"
      (click)="toggle($event)"
    >
      <label tuiLabel>Pays</label>

      <input tuiInput [value]="selectedItem ? selectedItem.label : ''" [readonly]="true" />

      @if (selectedItem) {
        <i [class]="'fi fi-' + selectedItem.value"></i>
      }

      @if (value()) {
        <tui-icon icon="@tui.x" (click)="reset()" />
      }

      <tui-icon [icon]="opened() ? '@tui.chevron-down' : '@tui.chevron-up'" />
    </tui-textfield>
  </span>

  <ng-template #dropdownContent>
    <tui-textfield>
      <input
        tuiInput
        class="w-full"
        [value]="term"
        (input)="term = $event.target.value"
        (keyup)="filter()"
      />
      <tui-icon icon="@tui.x" class="cursor-pointer" (click)="resetSearch()" />
      <tui-icon icon="@tui.search" />
    </tui-textfield>
    <ul>
      <tui-data-list emptyContent="&nbsp;">
        @for (item of countries(); track $index) {
          <li
            (click)="selectItem(item)"
            role="option"
            class="cursor-pointer py-2 pl-4 pr-9 hover:bg-primary"
          >
            <div class="flex items-center space-x-3">
              <i [class]="'fi fi-' + item.value.toLowerCase()"></i>
              {{ item.label }}
            </div>

            <tui-icon [icon]="item.value == value() ? '@tui.check' : ''" />
          </li>
        }
      </tui-data-list>
    </ul>
  </ng-template>
</div>

<div class="relative">
  <span
    class="inline-block w-full rounded-md shadow-sm"
    [class]="invalid() ? 'border-2 border-error' : ''"
    (click)="opened = !opened"
  >
    <button
      type="button"
      class="cursor-pointer relative w-full rounded-md border border-gray-300 pl-3 pr-10 py-2 text-left focus:outline-none focus:shadow-outline-blue focus:border-blue-300 transition ease-in-out duration-150"
    >
      <div class="flex items-center space-x-3">
        @if (selectedItem) {
          <i [class]="'fi fi-' + selectedItem.value"></i>
          <span class="block truncate">{{ selectedItem.label }}</span>
        } @else {
          <span class="block truncate">&nbsp;</span>
        }
      </div>

      <span class="absolute inset-y-0 right-0 flex items-center pr-2">
        <span (click)="reset()"><tui-icon [icon]="selectedItem ? '@tui.x' : ''" /></span>
        <tui-icon [icon]="opened ? '@tui.chevron-down' : '@tui.chevron-up'" />
      </span>
    </button>
  </span>
  <div class="absolute mt-1 w-full rounded-md bg-base-100 shadow-lg" [class.hidden]="!opened">
    <label class="input input-primary w-full">
      <input
        type="text"
        autocomplete="off"
        class="w-full"
        [value]="term"
        (input)="term = $event.target.value"
        (keyup)="filter()"
      />
      <tui-icon icon="@tui.x" class="cursor-pointer" (click)="resetSearch()" />
      <tui-icon icon="@tui.search" />
    </label>

    <ul
      class="max-h-56 rounded-md py-1 text-base leading-6 shadow-xs overflow-auto focus:outline-none"
    >
      @for (item of countries(); track $index) {
        <li
          (click)="selectItem(item)"
          role="option"
          class="cursor-default select-none relative py-2 pl-4 pr-9 hover:bg-primary"
        >
          <div class="flex items-center space-x-3">
            <i [class]="'fi fi-' + item.value.toLowerCase()"></i>
            <span class="font-normal block truncate">
              {{ item.label }}
            </span>
          </div>
          <span class="absolute inset-y-0 right-0 flex items-center pr-4">
            <tui-icon [icon]="item.value == value() ? '@tui.check' : ''" />
          </span>
        </li>
      }
    </ul>
  </div>
</div>

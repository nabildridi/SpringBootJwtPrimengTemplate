<div class="relative active-zone" (tuiActiveZoneChange)="onZone($event)">
  <span class="w-full rounded-md shadow-sm" (click)="toggle()">
    <tui-textfield [tuiTextfieldCleaner]="false" [invalid]="invalid()">
      <label tuiLabel>Pays</label>

      <input tuiInput [value]="selectedItem ? selectedItem.label : ''" />

      @if (selectedItem) {
        <i [class]="'fi fi-' + selectedItem.value"></i>
      }

      @if (value()) {
        <tui-icon icon="@tui.x" (click)="reset()" />
      }

      <tui-icon [icon]="opened() ? '@tui.chevron-down' : '@tui.chevron-up'" />
    </tui-textfield>
  </span>

  <div
    class="absolute mt-1 z-9999 w-full rounded-md bg-base-100 shadow-lg"
    popover
    [class.hidden]="!opened()"
  >
    <label class="input input-primary w-full">
      <input
        type="text"
        autocomplete="off"
        class="w-full"
        [value]="term"
        (input)="term = $event.target.value"
        (keyup)="filter()"
      />
      <tui-icon icon="@tui.x" class="cursor-pointer" (click)="resetSearch()" />
      <tui-icon icon="@tui.search" />
    </label>

    <ul
      class="max-h-56 rounded-md py-1 text-base leading-6 shadow-xs overflow-auto focus:outline-none"
    >
      @for (item of countries(); track $index) {
        <li
          (click)="selectItem(item)"
          role="option"
          class="cursor-default select-none relative py-2 pl-4 pr-9 hover:bg-primary"
        >
          <div class="flex items-center space-x-3">
            <i [class]="'fi fi-' + item.value.toLowerCase()"></i>
            {{ item.label }}
          </div>

          <tui-icon [icon]="item.value == value() ? '@tui.check' : ''" />
        </li>
      }
    </ul>
  </div>
</div>

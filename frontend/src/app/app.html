<p-blockUI [blocked]="uiBlocked()">
  @if (uiBlocked()) {
    <div class="flex items-center justify-center h-full w-full">
      <p-progressSpinner
        [style]="{ width: '10em', height: '10em' }"
        strokeWidth="4"
        animationDuration="1s"
      ></p-progressSpinner>
    </div>
  }
</p-blockUI>

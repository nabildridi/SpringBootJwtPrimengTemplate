<form (submit)="submitData($event)" class="space-y-5">
  <div class="card bg-base-100 shadow-sm">
    <div class="card-body">
      <h2 class="card-title">Intervenants</h2>

      <ul class="list bg-base-100 rounded-box shadow-md">
        <li class="p-4 pb-2">
          <button type="button" class="daisy-btn btn-primary" (click)="addIntervenant()">
            Ajouter un conditionneur ou un importateur
          </button>
        </li>

        @if (dataForm.intervenants.length > 0) {
          @for (item of dataForm.intervenants; track $index) {
            <li class="list-row justify-center items-center">
              <div>
                <tui-textfield>
                  <label tuiLabel>nom</label>
                  <input tuiInput type="text" [formField]="item.intervenantName" class="w-full" />
                </tui-textfield>
              </div>
              <div>
                <tui-textfield>
                  <label tuiLabel>interventionMethod</label>
                  <input
                    tuiInput
                    type="text"
                    [formField]="item.interventionMethod"
                    class="w-full"
                  />
                </tui-textfield>
              </div>
              <div>
                <tui-textfield>
                  <label tuiLabel>intervenantPays</label>
                  <input tuiInput type="text" [formField]="item.intervenantPays" class="w-full" />
                </tui-textfield>
              </div>
              <button type="button" class="btn btn-circle" (click)="deleteIntervenant($index)">
                <tui-icon icon="@tui.heart" />
              </button>
            </li>
          }
        }
      </ul>
    </div>
  </div>
</form>

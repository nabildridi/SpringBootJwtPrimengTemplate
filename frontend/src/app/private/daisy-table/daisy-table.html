<div class="w-full card bg-base-100 shadow-md">
  <div class="card-body">
    <div class="overflow-x-auto">
      <table class="table table-zebra">
        <thead>
          <tr>
            <th>#</th>
            <th>Username</th>
            <th>First name</th>
            <th>Last name</th>
          </tr>
        </thead>
        <tbody>
          @for (item of data(); track $index) {
            <tr>
              <td>{{ item.id }}</td>
              <td>{{ item.username }}</td>
              <td>{{ item.firstname }}</td>
              <td>{{ item.lastname }}</td>
            </tr>
          }
        </tbody>
      </table>
    </div>

    <div class="flex flex-wrap items-center justify-between gap-3 mt-2">
      <span id="info" class="text-sm opacity-70"></span>
      <div class="join">
        <button class="join-item btn" (click)="paginate('first')">
          <tui-icon icon="@tui.chevron-first" />
        </button>
        <button class="join-item btn" (click)="paginate('backward')">
          <tui-icon icon="@tui.chevron-left" />
        </button>
        <button class="join-item btn">{{ pageSignal() + 1 }}</button>
        <button class="join-item btn" (click)="paginate('forward')">
          <tui-icon icon="@tui.chevron-right" />
        </button>
        <button class="join-item btn" (click)="paginate('last')">
          <tui-icon icon="@tui.chevron-last" />
        </button>
      </div>
    </div>
  </div>
</div>

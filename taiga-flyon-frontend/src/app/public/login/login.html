<div
  class="min-h-screen select-none"
  style="background: linear-gradient(140deg, #fffbf5 0%, #fff4e6 30%, #fff0f6 60%, #f3f0ff 100%)"
>
  <!-- ╔══════════════════════════════════════╗ -->
  <!-- ║       ANIMATED BACKGROUND           ║ -->
  <!-- ╚══════════════════════════════════════╝ -->
  <div class="fixed inset-0 pointer-events-none overflow-hidden" aria-hidden="true">
    <!-- large morphing shapes -->
    <div
      class="absolute w-[500px] h-[500px] -top-40 -left-40 bg-gradient-to-br from-amber-100/60 to-orange-100/60 animate-morph animate-pulse-soft"
    ></div>
    <div
      class="absolute w-[420px] h-[420px] -bottom-32 -right-32 bg-gradient-to-br from-rose-100/50 to-pink-100/50 animate-morph animate-pulse-soft"
      style="animation-delay: 3s"
    ></div>
    <div
      class="absolute w-[350px] h-[350px] top-1/3 left-2/3 bg-gradient-to-br from-violet-100/40 to-indigo-100/30 animate-morph animate-pulse-soft"
      style="animation-delay: 6s"
    ></div>

    <!-- orbiting dots system 1 -->
    <div class="absolute top-[18%] left-[12%]">
      <div class="relative w-0 h-0">
        <div class="absolute animate-orbit" style="--radius: 90px; --dur: 18s">
          <span class="block w-3 h-3 rounded-full bg-orange-300/50"></span>
        </div>
        <div class="absolute animate-orbit-reverse" style="--radius: 60px; --dur: 14s">
          <span class="block w-2 h-2 rounded-full bg-amber-400/40"></span>
        </div>
      </div>
    </div>

    <!-- orbiting dots system 2 -->
    <div class="absolute bottom-[22%] right-[10%]">
      <div class="relative w-0 h-0">
        <div class="absolute animate-orbit" style="--radius: 70px; --dur: 22s">
          <span class="block w-2.5 h-2.5 rounded-full bg-pink-300/50"></span>
        </div>
        <div class="absolute animate-orbit-reverse" style="--radius: 100px; --dur: 28s">
          <span class="block w-2 h-2 rounded-full bg-violet-300/40"></span>
        </div>
      </div>
    </div>

    <!-- grid pattern overlay -->
    <svg class="absolute inset-0 w-full h-full opacity-[.035]">
      <defs>
        <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
          <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#fb923c" stroke-width=".5" />
        </pattern>
      </defs>
      <rect width="100%" height="100%" fill="url(#grid)" />
    </svg>

    <!-- floating mini shapes -->
    <div class="absolute top-[10%] right-[30%] animate-float" style="animation-delay: 1s">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
        <rect
          x="4"
          y="4"
          width="16"
          height="16"
          rx="3"
          stroke="#f9a8d4"
          stroke-width="1.5"
          opacity=".5"
          transform="rotate(20 12 12)"
        />
      </svg>
    </div>
    <div class="absolute top-[55%] left-[6%] animate-float" style="animation-delay: 2.5s">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
        <circle cx="10" cy="10" r="7" stroke="#c4b5fd" stroke-width="1.5" opacity=".4" />
      </svg>
    </div>
    <div class="absolute bottom-[12%] left-[35%] animate-float" style="animation-delay: 0.8s">
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
        <polygon points="9,1 17,14 1,14" stroke="#fdba74" stroke-width="1.5" opacity=".4" />
      </svg>
    </div>
  </div>

  <!-- ╔══════════════════════════════════════╗ -->
  <!-- ║            MAIN LAYOUT              ║ -->
  <!-- ╚══════════════════════════════════════╝ -->
  <div class="min-h-screen flex items-center justify-center px-4 py-16 relative z-10">
    <div
      class="w-full max-w-5xl flex rounded-[2rem] overflow-hidden shadow-2xl shadow-orange-200/40 animate-scale-in"
    >
      <!-- ── LEFT PANEL (info / branding) ── -->
      <div
        class="hidden lg:flex lg:w-[45%] relative overflow-hidden bg-gradient-to-br from-orange-400 via-amber-400 to-yellow-400 animate-gradient-x p-10 flex-col justify-between"
      >
        <!-- Decorative circles -->
        <div
          class="absolute -top-16 -right-16 w-56 h-56 rounded-full border border-white/20 animate-pulse-soft"
        ></div>
        <div
          class="absolute -bottom-20 -left-20 w-64 h-64 rounded-full border border-white/15 animate-pulse-soft"
          style="animation-delay: 2s"
        ></div>
        <div
          class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-72 h-72 rounded-full bg-white/5"
        ></div>

        <!-- Logo top-left -->
        <div class="relative z-10 animate-slide-up">
          <div class="flex items-center gap-3 mb-1">
            <div
              class="w-10 h-10 rounded-xl bg-white/25 backdrop-blur flex items-center justify-center"
            >
              <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M13 10V3L4 14h7v7l9-11h-7z"
                />
              </svg>
            </div>
            <span class="text-white text-xl font-extrabold tracking-tight">login</span>
          </div>
        </div>

        <!-- Center illustration -->
        <div class="relative z-10 flex-1 flex items-center justify-center my-8">
          <div class="relative">
            <!-- Main illustration circle -->
            <div
              class="w-52 h-52 rounded-full bg-white/15 backdrop-blur-sm flex items-center justify-center animate-float"
            >
              <div class="w-40 h-40 rounded-full bg-white/20 flex items-center justify-center">
                <svg
                  class="w-20 h-20 text-white/90"
                  fill="none"
                  stroke="currentColor"
                  viewBox="0 0 24 24"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="1.5"
                    d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"
                  />
                </svg>
              </div>
            </div>
            <!-- Orbiting badges -->
            <div class="absolute inset-0 flex items-center justify-center">
              <div class="animate-orbit" style="--radius: 120px; --dur: 16s">
                <div
                  class="w-10 h-10 rounded-xl bg-white/30 backdrop-blur flex items-center justify-center shadow-lg"
                >
                  <span class="text-lg">🚀</span>
                </div>
              </div>
            </div>
            <div class="absolute inset-0 flex items-center justify-center">
              <div class="animate-orbit-reverse" style="--radius: 120px; --dur: 20s">
                <div
                  class="w-10 h-10 rounded-xl bg-white/30 backdrop-blur flex items-center justify-center shadow-lg"
                >
                  <span class="text-lg">🔐</span>
                </div>
              </div>
            </div>
            <div class="absolute inset-0 flex items-center justify-center">
              <div class="animate-orbit" style="--radius: 120px; --dur: 24s">
                <div
                  class="w-10 h-10 rounded-xl bg-white/30 backdrop-blur flex items-center justify-center shadow-lg"
                >
                  <span class="text-lg">⚡</span>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- ── RIGHT PANEL (login form) ── -->

      <div
        class="w-full lg:w-[55%] glass border border-white/50 p-8 sm:p-12 flex flex-col justify-center relative overflow-hidden animate-glow-pulse"
      >
        <!-- Mobile logo (visible only on small screens) -->
        <div class="flex lg:hidden items-center gap-2.5 mb-8 animate-slide-up">
          <div
            class="w-9 h-9 rounded-xl bg-gradient-to-br from-orange-400 to-amber-400 flex items-center justify-center"
          >
            <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M13 10V3L4 14h7v7l9-11h-7z"
              />
            </svg>
          </div>
          <span
            class="text-lg font-extrabold bg-gradient-to-r from-orange-500 to-amber-500 bg-clip-text text-transparent"
            >Nexus</span
          >
        </div>

        <!-- Heading -->
        <div class="mb-8 animate-slide-up delay-100">
          <h2 class="text-2xl sm:text-3xl font-extrabold text-amber-900 tracking-tight">
            Sign in to your account
          </h2>
          <p class="text-amber-600/70 mt-2 text-sm">
            Enter your credentials to access your dashboard
          </p>
        </div>

        <!-- Form -->

        <form (submit)="submitLogin($event)" id="loginForm" class="space-y-5">
          <!-- Email -->
          <div class="animate-slide-up delay-200">
            <label
              class="text-xs font-semibold text-amber-700 uppercase tracking-wider mb-1.5 block"
              >Email</label
            >
            <div class="relative focus-ring rounded-xl transition-shadow duration-300">
              <tui-textfield iconStart="@tui.user">
                <input tuiInput type="text" [formField]="loginForm.username" class="w-full" />
              </tui-textfield>
            </div>
          </div>

          <!-- Password -->
          <div class="animate-slide-up delay-300">
            <div class="flex justify-between items-center mb-1.5">
              <label
                class="text-xs font-semibold text-amber-700 uppercase tracking-wider mb-1.5 block"
                >Password</label
              >
              <a
                href="#"
                class="text-xs font-semibold text-orange-500 hover:text-orange-600 transition-colors relative group"
              >
                Forgot?
                <span
                  class="absolute -bottom-0.5 left-0 w-0 h-px bg-orange-400 group-hover:w-full transition-all duration-300"
                ></span>
              </a>
            </div>
            <div class="relative focus-ring rounded-xl transition-shadow duration-300">
              <tui-textfield iconStart="@tui.key">
                <input tuiInput type="password" class="w-full" [formField]="loginForm.password" />
                <tui-icon tuiPassword />
              </tui-textfield>
            </div>
          </div>

          <!-- Remember + 2FA toggle -->
          <div class="flex items-center justify-between animate-fade-in delay-400">
            <label class="flex items-center gap-2.5 cursor-pointer group">
              <div class="relative">
                <input type="checkbox" class="sr-only peer" checked />
                <div
                  class="w-9 h-5 rounded-full bg-orange-200 peer-checked:bg-gradient-to-r peer-checked:from-orange-400 peer-checked:to-amber-400 transition-all duration-300"
                ></div>
                <div
                  class="absolute top-0.5 left-0.5 w-4 h-4 rounded-full bg-white shadow-sm peer-checked:translate-x-4 transition-transform duration-300"
                ></div>
              </div>
              <span class="text-sm text-amber-700 font-medium">Remember me</span>
            </label>
          </div>

          <!-- Submit -->
          <div class="animate-slide-up delay-500 pt-1">
            <button
              type="submit"
              [disabled]="loginForm().invalid()"
              class="daisy-btn relative w-full py-4 rounded-xl bg-gradient-to-r from-orange-500 via-amber-500 to-yellow-500 animate-gradient-x text-white font-bold text-sm tracking-wide shadow-lg shadow-orange-200/60 hover:shadow-xl hover:shadow-orange-300/60 hover:-translate-y-0.5 active:translate-y-0 transition-all duration-300 overflow-hidden group disabled:opacity-60 disabled:cursor-not-allowed"
            >
              Log in
            </button>
          </div>
        </form>

        <!-- Sign-up link -->
        <p class="text-center text-sm text-amber-600 mt-8 animate-fade-in delay-700">
          New here?
          <a
            href="#"
            class="font-bold bg-gradient-to-r from-orange-500 to-rose-500 bg-clip-text text-transparent relative group"
          >
            Create an account
            <span
              class="absolute -bottom-0.5 left-0 w-0 h-px bg-gradient-to-r from-orange-400 to-rose-400 group-hover:w-full transition-all duration-300"
            ></span>
          </a>
        </p>

        <!-- Confetti container -->
        <div
          id="confettiContainer"
          class="absolute inset-0 pointer-events-none overflow-hidden"
        ></div>
      </div>
    </div>
  </div>
</div>

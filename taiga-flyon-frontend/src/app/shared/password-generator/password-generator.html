<div class="flex flex-col">
  <tui-textfield iconStart="@tui.key" [invalid]="invalid()">
    <label tuiLabel>{{ label() }}</label>
    <input
      tuiInput
      type="password"
      class="w-full"
      [value]="value()"
      (input)="value.set($event.target.value)"
      (blur)="touch.emit()"
      autocomplete="new-password"
    />
    <tui-icon
      icon="@tui.pencil-sparkles"
      tuiTooltip="Générer votre mot de passe"
      (click)="toggle()"
    />
    <tui-icon tuiPassword />
  </tui-textfield>

  <div class="card shadow-md" [class.hidden]="generatorFlag()">
    <div class="card-body">
      <h2 class="card-title">Générer votre mot de passe</h2>
      <tui-textfield>
        <input tuiInputSlider [max]="20" [min]="12" [(ngModel)]="passwordLength" />
        <input tuiSlider type="range" />
      </tui-textfield>
      <div class="justify-end card-actions">
        <button type="button" class="btn btn-primary" (click)="generate()">Générer</button>
      </div>
    </div>
  </div>
</div>

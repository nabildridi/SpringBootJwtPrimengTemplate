<tui-accordion>
  <button tuiAccordion>Taiga UI cdk</button>
  <tui-expand>
    <form (submit)="submitLogin($event)" class="space-y-5">
      <n-select-input label="Pays de production" [formField]="pageForm.country"></n-select-input>

      <button class="daisy-btn btn-primary" type="submit" [disabled]="pageForm().invalid()">
        Submit
      </button>
    </form>
  </tui-expand>
</tui-accordion>

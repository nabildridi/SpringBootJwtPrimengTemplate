<div class="card shadow-sm">
  <div class="card-body">
    <div class="card-title">
      <tui-textfield iconStart="@tui.search">
        <label tuiLabel>Rechercher</label>
        <input tuiInput [(ngModel)]="filterValue" (keyup)="onFilter($event)" />
      </tui-textfield>
    </div>

    <table tuiTable>
      <tbody tuiTbody>
        @for (item of data(); track $index) {
          <tr tuiTr>
            <td tuiTd>
              <div class="card w-full bg-base-100 card-xl shadow-sm">
                <div class="card-body">
                  <h2 class="card-title">{{ item.username }}</h2>
                  <p>{{ item.firstname }} {{ item.lastname }}</p>
                  <div class="justify-end card-actions">
                    <button class="btn btn-primary">Buy Now</button>
                  </div>
                </div>
              </div>
            </td>
          </tr>
        }
      </tbody>

      <tfoot>
        <tr>
          <td [colSpan]="columns.length">
            <tui-table-pagination
              class="tui-space_top-2"
              [page]="pageSignal()"
              [total]="totalSignal()"
              [size]="sizeSignal()"
              (paginationChange)="onPagination($event)"
            />
          </td>
        </tr>
      </tfoot>
    </table>
  </div>
</div>

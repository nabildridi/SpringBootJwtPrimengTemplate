<ngx-datatable
  class="material"
  [rows]="data()"
  [columns]="columns"
  [limit]="10"
  rowHeight="auto"
  columnMode="force"
  [headerHeight]="50"
  [footerHeight]="50"
  (page)="loadFromServer($event)"
  [externalPaging]="true"
  [externalSorting]="true"
  [count]="totalRows()"
>
  @for (column of columns; track $index) {
    <ngx-datatable-column name="{{ column.name }}" prop="{{ column.prop }}"> </ngx-datatable-column>
  }

  <ngx-datatable-column name="Actions" [sortable]="false">
    <ng-template let-row="row" ngx-datatable-cell-template>
      <button class="daisy-btn btn-sm btn-primary" (click)="onEdit(row)">Modifier</button>
      <button class="daisy-btn btn-sm btn-danger" (click)="onDelete(row)">Supprimer</button>
    </ng-template>
  </ngx-datatable-column>
</ngx-datatable>

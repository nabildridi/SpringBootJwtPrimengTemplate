<button class="btn btn-primary" (click)="showToast()">toast</button>

<form (submit)="submitLogin($event)" class="space-y-8 mt-8">
  <div>
    <n-text-input
      [formField]="pageForm.username"
      label="username"
      type="text"
      icon="user"
    ></n-text-input>
  </div>

  <div>
    <n-password-input [formField]="pageForm.password" label="Mot de passe"></n-password-input>
  </div>

  <div>
    <n-country-select-input [formField]="pageForm.country" label="Pays"></n-country-select-input>
  </div>

  <div>
    <n-password-generator [formField]="pageForm.generated" label="Generator"></n-password-generator>
  </div>

  <div>
    <n-file-input
      [formField]="pageForm.logo"
      label="Choisir une image pour logo"
      icon="user"
    ></n-file-input>
  </div>

  <button type="submit" [disabled]="pageForm().invalid()" class="daisy-btn">Submit</button>
</form>

<button class="btn btn-primary" (click)="openConfirm()">Open Confirm</button>

<button class="btn btn-primary" (click)="openModal()">Open Component modal</button>

<div class="w-64 h-64 p-2 aspect-video overflow-hidden rounded-lg bg-gray-100">
  <img src="/pasted-image-0-2-3-1024x950.png" alt="Aperçu" class="h-full w-full object-cover" />
</div>

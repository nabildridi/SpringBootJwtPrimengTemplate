<form (submit)="submitLogin($event)" class="space-y-5 mt-8 p-8">
  <div>
    <n-text-input [formField]="loginForm.username" label="Email" type="email"></n-text-input>
  </div>

  <div>
    <n-password-input [formField]="loginForm.password" label="Mot de passe"></n-password-input>
  </div>

  <div>
    <n-country-select
      [formField]="loginForm.country"
      label="Pays"
      class="w-full"
    ></n-country-select>
  </div>

  <div class="overflow-x-auto rounded-box border border-base-content/5 bg-base-100">
    <table class="table">
      <!-- head -->
      <thead>
        <tr>
          <th>Id</th>
          <th>Name</th>
          <th>Job</th>
          <th>Favorite Color</th>
        </tr>
      </thead>
      <tbody>
        <!-- row 1 -->
        <tr>
          <th>1</th>
          <td>Cy Ganderton</td>
          <td>Quality Control Specialist</td>
          <td>Blue</td>
        </tr>
        <!-- row 2 -->
        <tr>
          <th>2</th>
          <td>Hart Hagerty</td>
          <td>Desktop Support Technician</td>
          <td>Purple</td>
        </tr>
        <!-- row 3 -->
        <tr>
          <th>3</th>
          <td>Brice Swyre</td>
          <td>Tax Accountant</td>
          <td>Red</td>
        </tr>
      </tbody>
    </table>
  </div>

  <button ngpButton type="submit" [disabled]="loginForm().invalid()" class="btn btn-primary mt-8">
    Submit
  </button>
</form>

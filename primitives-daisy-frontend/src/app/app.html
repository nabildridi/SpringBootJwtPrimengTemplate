<form (submit)="submitLogin($event)" class="space-y-5 mt-8">
  <label class="floating-label">
    <span>Your Email</span>
    <input
      ngpInput
      type="text"
      placeholder="Your Email"
      [formField]="loginForm.username"
      class="input w-full"
    />
  </label>

  <label class="floating-label">
    <span>Your Password</span>
    <input
      ngpInput
      type="password"
      placeholder="Your Password"
      class="input w-full"
      [formField]="loginForm.password"
    />
  </label>

  <label class="floating-label">
    <span>Pays</span>

    <n-country-select
      [formField]="loginForm.country"
      label="Pays2"
      class="w-full"
    ></n-country-select>
  </label>

  <button ngpButton type="submit" [disabled]="loginForm().invalid()" class="btn btn-primary mt-8">
    Submit
  </button>
</form>

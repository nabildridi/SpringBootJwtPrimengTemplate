<form (submit)="submitLogin($event)" class="space-y-5 mt-8 p-8">
  <div>
    <n-text-input [formField]="loginForm.username" label="Email" type="email"></n-text-input>
  </div>

  <div>
    <n-password-input [formField]="loginForm.password" label="Mot de passe"></n-password-input>
  </div>

  <div>
    <n-country-select
      [formField]="loginForm.country"
      label="Pays"
      class="w-full"
    ></n-country-select>
  </div>

  <n-table
    [data]="data()"
    [lazy]="true"
    [pageLength]="pageLength"
    (onLazyLoad)="lazyLoadFunc($event)"
    [totalRecords]="totalRecords"
    sortField="id"
    [sortOrder]="-1"
    [colsDefs]="{}"
  ></n-table>

  <button ngpButton type="submit" [disabled]="loginForm().invalid()" class="btn btn-primary mt-8">
    Submit
  </button>
</form>

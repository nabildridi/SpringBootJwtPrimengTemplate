<div class="card w-full bg-base-100 shadow-lg">
  <div class="card-body">
    <h2 class="card-title text-2xl">Mon Produit</h2>
    <div class="divider"></div>

    <n-collapse title="Informations principales">
      <div class="grid grid-cols-2 gap-4">
        <div>
          <n-text-input [formField]="stepOneForm().nom" label="Nom" icon="edit"></n-text-input>
        </div>

        <div>
          <n-select-input
            [formField]="stepOneForm().marqueId"
            label="Marque"
            [listItems]="marques()"
          ></n-select-input>
        </div>

        <div>
          <n-country-select-input
            label="Pays de production"
            [formField]="stepOneForm().paysProd"
          ></n-country-select-input>
        </div>

        <div>
          <n-text-input
            [formField]="stepOneForm().regProd"
            label="Région de production"
            icon="edit"
          ></n-text-input>
        </div>

        <div>
          <n-grouped-select
            [formField]="stepOneForm().prodNature"
            label="Nature"
            [listItems]="natures"
          ></n-grouped-select>
        </div>

        <div>
          <n-select-input
            [formField]="stepOneForm().methodProd"
            label="Méthode de production"
            listId="methods"
          ></n-select-input>
        </div>

        <div>
          <n-select-input
            [formField]="stepOneForm().teneurSucre"
            label="Teneur de sucre"
            listId="teneurs"
          ></n-select-input>
        </div>
      </div>
    </n-collapse>

    <!-- Informations secondaires -->
    <n-collapse title="Informations secondaires">
      <div class="grid grid-cols-2 gap-4 mb-4">
        <div>
          <n-select-input
            [formField]="stepOneForm().millesime"
            label="Millésime"
            [listItems]="millesimes"
          ></n-select-input>
        </div>

        <div>
          <n-text-input
            [formField]="stepOneForm().appellation"
            label="Appellation"
            icon="edit"
          ></n-text-input>
        </div>
      </div>

      <fieldset class="fieldset border">
        <legend class="fieldset-legend">Contenants</legend>
        <n-multi-button-selector
          listId="contenant"
          [formField]="stepOneForm().contenant"
        ></n-multi-button-selector>
      </fieldset>

      <fieldset class="fieldset border">
        <legend class="fieldset-legend">Couleurs</legend>
        <n-multi-button-selector
          listId="colors"
          [formField]="stepOneForm().color"
        ></n-multi-button-selector>
      </fieldset>
    </n-collapse>

    <!-- Image -->
    <n-collapse title="Image de produit">
      <div class="flex justify-around">
        <div class="flex w-full">
          <nz-upload
            nzAccept=""
            [(nzFileList)]="fileList"
            [nzBeforeUpload]="beforeUpload"
            nzAccept="image/*"
            [nzRemove]="removeFile"
          >
            <button type="button" class="daisy-btn btn-primary">
              <i class="bx bx-folder-up-arrow"></i>
              Select File
            </button>
          </nz-upload>
        </div>
        <div class="flex w-full justify-center">
          <div class="card bg-base-100 card-xs shadow-sm">
            <div class="card-body">
              <h2 class="card-title">Logo actuel</h2>
              @if (inputsModel().resizedImage) {
                <div class="w-64 h-64">
                  <img
                    [src]="'data:image/png;base64,' + inputsModel().resizedImage"
                    class="h-64 w-64 object-none"
                    alt=""
                    onclick="full_image_modal.showModal()"
                  />
                </div>

                <div class="justify-center card-actions">
                  <button type="button" class="daisy-btn btn-primary" (click)="deleteImage()">
                    Supprimer l'image'
                  </button>
                </div>
              }
            </div>
          </div>
        </div>
        <div class="flex w-full justify-center items-center">
          <label nz-checkbox [formField]="stepOneForm().showPhotoFiche"
            >Afficher le logo dans la fiche</label
          >
        </div>
      </div>
    </n-collapse>

    <!-- intervenants -->
    <n-collapse title="Intervenants">
      <button type="button" class="daisy-btn btn-primary mb-4" (click)="addIntervenant()">
        Ajouter un conditionneur ou un importateur
      </button>

      @for (item of stepOneForm().intervenants; track $index) {
        <div class="flex gap-4 items-center w-full mb-2">
          <div>
            <n-select-input
              [formField]="item.interventionMethod"
              label="Méthode d'intervention"
              listId="InterventionMethods"
            ></n-select-input>
          </div>

          <div>
            <n-text-input
              [formField]="item.intervenantName"
              label="Nom de conditionneur ou importateur"
              icon="edit"
            ></n-text-input>
          </div>

          <div>
            <n-country-select-input
              label="Pays de conditionneur ou importateur"
              [formField]="item.intervenantPays"
            ></n-country-select-input>
          </div>

          <div class="shrink">
            <button type="button" class="daisy-btn btn-error" (click)="deleteIntervenant($index)">
              <i class="bx bx-trash"></i>
            </button>
          </div>
        </div>
      }
    </n-collapse>
  </div>
</div>

<dialog id="full_image_modal" class="modal">
  <div class="modal-box">
    <img [src]="'data:image/png;base64,' + inputsModel().originalImage" alt="" />
    <div class="modal-action">
      <form method="dialog">
        <button class="btn">Fermer</button>
      </form>
    </div>
  </div>
</dialog>

<div class="card w-full bg-base-100 shadow-lg">
  <div class="card-body">
    <h2 class="card-title text-2xl">Données nutritionnelles</h2>
    <div class="divider"></div>

    <n-collapse title="Valeurs énergetiques">
      <div class="grid grid-cols-2 gap-4">
        <div>
          <n-number-input
            [formField]="stepTwoForm().alcoometrique"
            label="Titre alcoométrique volumique (% vol.)"
            [minimum]="0"
            icon="edit"
            (input)="calculateEnergiesFromInputs()"
            (keydown.arrowDown)="calculateEnergiesFromInputs()"
            (keydown.arrowUp)="calculateEnergiesFromInputs()"
            suffix="%"
          ></n-number-input>
        </div>

        <div>
          <n-number-input
            [formField]="stepTwoForm().glucose"
            label="Sucres résiduels, Glucose + Fructose (g/L)"
            [minimum]="0"
            icon="edit"
            (input)="calculateEnergiesFromInputs()"
            (keydown.arrowDown)="calculateEnergiesFromInputs()"
            (keydown.arrowUp)="calculateEnergiesFromInputs()"
            suffix="g/L"
          ></n-number-input>
        </div>

        <div>
          <n-number-input
            [formField]="stepTwoForm().energeticValueKcal"
            label="Valeur énergétique (kcal/100ml)"
            [minimum]="0"
            icon="edit"
            suffix="kcal/100ml"
          ></n-number-input>
        </div>

        <div>
          <n-number-input
            [formField]="stepTwoForm().energeticValueKj"
            label="Valeur énergétique (kJ)"
            [minimum]="0"
            icon="edit"
            suffix="kJ"
          ></n-number-input>
        </div>
      </div>
    </n-collapse>

    <n-collapse title="Autres données">
      <div class="grid grid-cols-2 gap-4">
        <div>
          <n-number-input
            [formField]="stepTwoForm().sulfur"
            label="Dioxyde de soufre total (mg/L)"
            [minimum]="0"
            icon="edit"
            suffix="mg/L"
          ></n-number-input>
        </div>

        <div>
          <n-number-input
            [formField]="stepTwoForm().acidity"
            label="Acidité totale (g/L)"
            [minimum]="0"
            icon="edit"
            suffix="g/L"
          ></n-number-input>
        </div>

        <div>
          <n-number-input
            [formField]="stepTwoForm().ph"
            label="pH"
            [minimum]="0"
            icon="edit"
            suffix=""
          ></n-number-input>
        </div>

        <div>
          <n-number-input
            [formField]="stepTwoForm().aceticAcid"
            label="Acide acétique (g/L)"
            [minimum]="0"
            icon="edit"
            suffix="g/L"
          ></n-number-input>
        </div>

        <div>
          <n-number-input
            [formField]="stepTwoForm().polyphenols"
            label="Taux de polyphénols (mg/L)"
            [minimum]="0"
            icon="edit"
            suffix="mg/L"
          ></n-number-input>
        </div>
      </div>
    </n-collapse>

    <n-collapse title="Autres données">
      <div class="grid grid-cols-2 gap-4">
        <fieldset class="fieldset">
          <legend class="fieldset-legend">Levure</legend>
          <n-tristate
            [formField]="stepTwoForm().yeast"
            trueLabel="Oui"
            falseLabel="Non"
            nullLabel="Non communiqué"
          ></n-tristate>
        </fieldset>

        <fieldset class="fieldset">
          <legend class="fieldset-legend">Collage</legend>
          <n-tristate
            [formField]="stepTwoForm().collage"
            trueLabel="Oui"
            falseLabel="Non"
            nullLabel="Non communiqué"
          ></n-tristate>
        </fieldset>

        <fieldset class="fieldset">
          <legend class="fieldset-legend">Filtrage</legend>
          <n-tristate
            [formField]="stepTwoForm().filtrage"
            trueLabel="Oui"
            falseLabel="Non"
            nullLabel="Non communiqué"
          ></n-tristate>
        </fieldset>
      </div>
    </n-collapse>
  </div>
</div>

<div class="flex w-full justify-center">
  @if (stepOneForm != null && stepTwoForm != null) {
    <ul class="steps steps-horizontal text-2xl">
      <li
        class="step"
        [class.step-primary]="stepNumber() >= 1 && stepOneForm().valid()"
        [class.step-error]="stepOneForm().invalid()"
        (click)="goTo(1)"
      >
        Mon produit
      </li>
      <li
        class="step"
        [class.step-primary]="stepNumber() >= 2 && stepTwoForm().valid()"
        [class.step-error]="stepTwoForm().invalid()"
        (click)="goTo(2)"
      >
        Données nutritionnelles
      </li>
      <li
        class="step"
        [class.step-primary]="stepNumber() >= 3 && stepNumber3Valid()"
        [class.step-error]="!stepNumber3Valid()"
        (click)="goTo(3)"
      >
        Ingrédients
      </li>
      <li
        class="step"
        [class.step-primary]="stepNumber() >= 4 && stepNumber4Valid()"
        [class.step-error]="!stepNumber4Valid()"
        (click)="goTo(4)"
      >
        Emballage
      </li>
    </ul>
  }
</div>

<div class="w-full mt-8">
  <form (submit)="submitData($event)" class="space-y-5">
    <div class="w-full">
      <button
        class="daisy-btn btn-primary w-full"
        type="submit"
        [disabled]="stepOneForm().invalid() || stepTwoForm().invalid()"
      >
        Sauvegarder
      </button>
    </div>

    @if (stepNumber() == 1 && stepOneForm != null) {
      <app-product-step-one
        [stepOneForm]="stepOneForm"
        [inputsModel]="pageModel"
        [productImage]="photoProduit"
      ></app-product-step-one>
    }

    @if (stepNumber() == 2 && stepTwoForm != null) {
      <app-product-step-two
        [stepTwoForm]="stepTwoForm"
        [inputsModel]="pageModel"
      ></app-product-step-two>
    }

    <div class="w-full mt-4 mb-4">
      <button
        class="daisy-btn btn-primary w-full"
        type="submit"
        [disabled]="stepOneForm().invalid() || stepTwoForm().invalid()"
      >
        Sauvegarder
      </button>
    </div>
  </form>
</div>

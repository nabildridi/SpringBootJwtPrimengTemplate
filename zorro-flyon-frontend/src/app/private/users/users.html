<div class="card w-full border">
  <div class="card-body">
    <div class="card-title">
      <div class="input">
        <span class="bx bx-search text-base-content/80 my-auto me-3 size-5 shrink-0"></span>
        <input
          type="search"
          [value]="globalFilterText"
          class="grow"
          placeholder="Rechercher"
          (input)="searchGlobalFilter($any($event.target).value)"
        />
      </div>
    </div>

    <nz-table
      nzShowSizeChanger
      [nzData]="data()"
      [nzFrontPagination]="false"
      [nzTotal]="totalRows()"
      [nzPageSize]="pageSize"
      (nzQueryParams)="loadFromServer($event)"
    >
      <thead>
        <tr>
          <th nzColumnKey="id" [nzSortFn]="true">id</th>
          <th nzColumnKey="username" [nzSortFn]="true">username</th>
          <th nzColumnKey="lastname" [nzSortFn]="true">lastname</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        @for (item of data(); track $index) {
          <tr>
            <td>{{ item.id }}</td>
            <td>{{ item.username }}</td>
            <td>{{ item.lastname }}</td>
            <td>
              <button class="btn">Default</button> <button class="btn btn-primary">Primary</button>
            </td>
          </tr>
        }
      </tbody>
    </nz-table>
  </div>
</div>
